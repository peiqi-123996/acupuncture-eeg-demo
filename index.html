<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>针尖上的脑电波 · 针灸脑电互动科普实验室</title>
<meta name="description" content="用可交互的方式看懂针灸过程中的脑电信号：波形从哪来、α 波和 β 波在看什么、一次观察为什么不能证明有效。" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">针</span>
      <div>
        <div class="brand-name">针尖上的脑电波</div>
        <div class="brand-sub">Acupuncture &amp; EEG · 互动科普实验室</div>
      </div>
    </div>
    <div class="top-tag"><span class="top-tag-dot"></span>信号演示 · 边看边学</div>
    <div class="top-right">
      <button id="btn-start" class="btn btn-primary">开始演示</button>
      <button id="btn-pause" class="btn">暂停</button>
      <button id="btn-reset" class="btn">重置</button>
      <div class="speed-group" id="speed-group">
        <button data-speed="1" class="speed active">1×</button>
        <button data-speed="4" class="speed">4×</button>
        <button data-speed="16" class="speed">16×</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar" id="nav"></nav>
    <main class="main" id="main"></main>
  </div>

  <footer class="statusbar">
    <span id="sim-status">待机中 · 点击「开始演示」</span>
    <span class="sep">·</span>
    <span>信号源：8 通道脑电（程序合成）</span>
    <span class="sep">·</span>
    <span>250 Hz / 24 bit / 8 通道</span>
    <span class="sep">·</span>
    <span id="sim-phase">阶段：—</span>
    <span class="spacer"></span>
    <span class="warn">本作品为科普演示，不涉及任何诊疗与疗效判断</span>
  </footer>
</div>

<script src="sim.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
